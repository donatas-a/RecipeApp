name: Supabase DB Migrations
run-name: Supabase DB Migrations (${{ github.sha }})

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

jobs:
  migrate:
    name: Push Supabase migrations via DB URL
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.39.2

      - name: Verify Supabase CLI
        run: supabase --version

      - name: Check Supabase DB URL
        id: supabase-db-url
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Supabase migration push because the SUPABASE_DB_URL secret is not configured."
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Validate Supabase DB URL for GitHub Actions
        if: steps.supabase-db-url.outputs.configured == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          if [[ "$SUPABASE_DB_URL" =~ @db\..*\.supabase\.co:5432/ ]]; then
            echo "::error::SUPABASE_DB_URL is using Supabase's direct database host (db.<project-ref>.supabase.co:5432), which often resolves to IPv6 and is not reachable from GitHub-hosted runners. Use the Supavisor pooler connection string from the Supabase dashboard instead."
            exit 1
          fi

      - name: Push migrations
        if: steps.supabase-db-url.outputs.configured == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          supabase db push --db-url "$SUPABASE_DB_URL"
