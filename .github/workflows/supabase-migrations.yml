name: Supabase DB Migrations
run-name: Supabase DB Migrations (${{ github.sha }})

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

jobs:
  migrate:
    name: Push Supabase migrations via DB URL
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.39.2

      - name: Verify Supabase CLI
        run: supabase --version

      - name: Push migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          : "${SUPABASE_DB_URL:?Missing GitHub secret SUPABASE_DB_URL}"
          supabase db push --db-url "$SUPABASE_DB_URL"
