<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Browser</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Recipe Browser</h1>
        <p>Browse your preloaded recipes database.</p>
      </header>

      <section class="controls">
        <label>
          API Base URL
          <input id="apiBase" type="text" placeholder="http://localhost:3000" />
        </label>
        <label>
          Search
          <input id="search" type="search" placeholder="e.g. pasta" />
        </label>
        <label>
          Locale
          <input id="locale" type="text" value="en" />
        </label>
        <button id="loadBtn">Load Recipes</button>
      </section>

      <section class="layout">
        <aside>
          <h2>Recipes</h2>
          <ul id="recipeList"></ul>
        </aside>

        <article>
          <h2>Details</h2>
          <div id="details">Select a recipe to view details.</div>
        </article>
      </section>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
